[package]
name = "queue-focus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minimal focus queue for GNOME: Now / Next / Later / Side"

[[bin]]
name = "queue-focus"
path = "src/main.rs"

[dependencies]
qf-core = { path = "../qf-core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gio = { version = "0.22", features = ["v2_80"] }
serde_json = "1"

[package.metadata.deb]
name = "queue-focus"
maintainer = "Michael Sinoplis <sinoplismichael@gmail.com>"
section = "utils"
priority = "optional"
depends = "$auto, libgtk-4-1 (>= 4.16), libadwaita-1-0 (>= 1.6), libglib2.0-bin, python3"
recommends = "gnome-shell (>= 48)"
extended-description = """\
A minimal focus queue for GNOME. Tasks are titles arranged in four buckets
(Now, Next, Later, Side); the head of Now is what you are doing right now and is
shown in the GNOME top bar via the bundled shell extension."""
assets = [
  ["target/release/queue-focus", "usr/bin/", "755"],
  ["../../data/org.queuefocus.QueueFocus.desktop", "usr/share/applications/", "644"],
  ["../../data/org.queuefocus.QueueFocus.service", "usr/share/dbus-1/services/", "644"],
  ["../../extension/queue-focus@queuefocus.org/*", "usr/share/gnome-shell/extensions/queue-focus@queuefocus.org/", "644"],
  ["../../extension/queue-focus@queuefocus.org/schemas/*", "usr/share/gnome-shell/extensions/queue-focus@queuefocus.org/schemas/", "644"],
  ["../../data/icons/hicolor/scalable/apps/org.queuefocus.QueueFocus.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["../../data/icons/hicolor/symbolic/apps/org.queuefocus.QueueFocus-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
  ["../../scripts/queue-focus-setup", "usr/bin/", "755"],
  ["../../README.md", "usr/share/doc/queue-focus/", "644"],
]

[package]
name = "uniffi-bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generates the Swift bindings for qf-ffi, so no global install is needed"
publish = false

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/main.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }

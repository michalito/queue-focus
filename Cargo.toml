[workspace]
resolver = "2"
members = ["crates/qf-core", "crates/qf-ffi", "crates/queue-focus", "crates/uniffi-bindgen"]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "MIT"
authors = ["Michael Sinoplis"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The macOS app's static library. A panic unwinds so UniFFI can hand it to
# Swift as an error with its message; symbols and line tables stay so Xcode
# can symbolicate Rust frames, and the app's own link strips them.
[profile.release-ffi]
inherits = "release"
panic = "unwind"
strip = false
debug = "line-tables-only"

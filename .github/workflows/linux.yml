# The GNOME side, in an Ubuntu 26.04 container for GTK 4.16 and libadwaita
# 1.6, which the runner's own Ubuntu lacks: formatting, Clippy and the
# scripts' syntax (`make check`), the workspace's tests with the GTK app's,
# the extension's against a stubbed GNOME Shell, the installer's and the
# versioning's (`make test`), the GTK windows on a virtual display
# (`make test-ui`), and the service over D-Bus and its command line
# (`make test-service`). The extension in a real GNOME Shell
# (`make test-extension-shell`) needs a GNOME session, and runs by hand.
name: Linux

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gnome:
    name: GNOME app, engine and extension
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config ca-certificates curl git make python3 \
            libgtk-4-dev libadwaita-1-dev libglib2.0-bin libglib2.0-dev-bin \
            xvfb xauth dbus dbus-x11 nodejs \
            libgl1-mesa-dri mesa-vulkan-drivers libegl1 libgles2 \
            desktop-file-utils gtk-update-icon-cache fonts-dejavu-core fonts-cantarell
      - uses: actions/checkout@v4
      # The tests make files unwritable to see a save fail, which root would
      # write all the same: they run as a user of their own.
      - name: A user to test as
        run: |
          useradd -m -s /bin/bash tester
          chown -R tester "$GITHUB_WORKSPACE"
          runuser -u tester -- env HOME=/home/tester sh -c \
            'curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component rustfmt,clippy'
      - name: make check
        run: runuser -u tester -- env HOME=/home/tester PATH=/home/tester/.cargo/bin:/usr/local/bin:/usr/bin:/bin make check
      - name: make test
        run: runuser -u tester -- env HOME=/home/tester PATH=/home/tester/.cargo/bin:/usr/local/bin:/usr/bin:/bin make test
      - name: make test-ui
        run: runuser -u tester -- env HOME=/home/tester PATH=/home/tester/.cargo/bin:/usr/local/bin:/usr/bin:/bin make test-ui
      - name: make test-service
        run: runuser -u tester -- env HOME=/home/tester PATH=/home/tester/.cargo/bin:/usr/local/bin:/usr/bin:/bin make test-service
